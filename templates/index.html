<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>認証パッド 時間管理</title>
<style>
:root{
  --paper:#EDEFF2; --surface:#FFFFFF; --ink:#171A1F; --muted:#6E7681;
  --line:#D7DBE0; --line-soft:#E6E9ED;
  --live:#17795E; --live-bg:#E4F1EC;
  --pending:#8A6A1F; --pending-bg:#F6EFDD;
  --stop:#A5342C; --stop-bg:#F7E7E5;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Courier New",monospace;
  --sans:-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",
         "Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
     font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:var(--surface);
       border-bottom:1px solid var(--line);padding:14px 22px;
       display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
header h1{font-size:16px}
header .meta{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
header .clock{margin-left:auto;font-size:22px;letter-spacing:.06em}
header .clock small{font-size:11px;color:var(--muted);letter-spacing:.1em;display:block;text-align:right}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:22px;
     display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}.side{position:static !important}}
.side{position:sticky;top:78px;display:grid;gap:16px}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
section.panel > h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line-soft)}
section.panel > .body{padding:16px}

/* ---------- rule card ---------- */
.cards{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card.off{background:#F7F8F9;border-style:dashed}
.card .top{display:flex;align-items:flex-start;gap:12px}
.card .name{font-size:15px;font-weight:650}
.card .note{color:var(--muted);font-size:12.5px}
.pill{font-size:11px;letter-spacing:.08em;padding:3px 9px;border-radius:99px;white-space:nowrap;
      border:1px solid transparent}
.pill.live{background:var(--live-bg);color:var(--live);border-color:#BFDFD4}
.pill.pending{background:var(--pending-bg);color:var(--pending);border-color:#E4D3A9}
.pill.stop{background:var(--stop-bg);color:var(--stop);border-color:#E8C3BF}
.code{font-family:var(--mono);font-size:27px;letter-spacing:.22em;margin:10px 0 2px}
.range{font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.04em}
.days{display:flex;gap:4px;margin:10px 0 6px}
.days span{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;
  font-size:11px;border:1px solid var(--line);color:var(--muted)}
.days span.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* 24時間バー = このアプリの主役。今この瞬間の位置が縦線で入る */
.bar{position:relative;height:16px;background:#F1F3F5;border:1px solid var(--line-soft);
     border-radius:4px;margin:10px 0 4px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:var(--live);opacity:.72}
.bar u{position:absolute;top:0;bottom:0;background:var(--pending);opacity:.5;width:2px}
.bar b{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--stop)}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);
       font-size:10px;color:var(--muted);letter-spacing:.04em}
.next{font-size:12.5px;color:var(--muted);margin-top:8px}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}

/* ---------- controls ---------- */
button{font-family:inherit;font-size:12.5px;padding:6px 12px;border-radius:6px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{border-color:#B9C0C8}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
button.go{background:var(--live-bg);border-color:#BFDFD4;color:var(--live)}
button.danger{background:var(--stop-bg);border-color:#E8C3BF;color:var(--stop)}
button:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-size:11.5px;letter-spacing:.06em;color:var(--muted);
      text-transform:uppercase;margin:12px 0 4px}
input,select{width:100%;font-family:inherit;font-size:14px;padding:7px 9px;
  border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input.mono{font-family:var(--mono);letter-spacing:.14em}
.row{display:flex;gap:10px}
.row > div{flex:1}
.checks{display:flex;gap:5px;flex-wrap:wrap}
.checks label{margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;background:#fff}
.checks label.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.checks input{display:none}
.inline{display:flex;align-items:center;gap:8px;margin-top:14px}
.inline input[type=checkbox]{width:auto}
.inline label{margin:0;text-transform:none;letter-spacing:0;color:var(--ink);font-size:13px}

/* ---------- tables & logs ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
th{font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
td.num{font-family:var(--mono);letter-spacing:.08em}
.logs{max-height:220px;overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.75}
.logs div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logs .ERROR{color:var(--stop)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.banner{background:var(--stop-bg);border:1px solid #E8C3BF;color:var(--stop);
  padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px}
.banner.ok{background:var(--live-bg);border-color:#BFDFD4;color:var(--live)}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px}
@media(prefers-reduced-motion:no-preference){
  .card,.panel{transition:border-color .15s ease}
}
</style>
</head>
<body data-device="{{ device_id }}" data-tz="{{ tz }}">

<header>
  <h1>認証パッド 時間管理</h1>
  <div class="meta">device <span class="mono">{{ device_id }}</span> ／ {{ tz }}</div>
  <a class="meta" href="/panel" target="_blank" rel="noopener"
     style="border:1px solid var(--line);border-radius:6px;padding:4px 10px;text-decoration:none">
     操作パネルを開く</a>
  <div class="clock mono" id="clock">--:--:--<small id="today">----</small></div>
</header>

<main>
  <div>
    <div id="banner"></div>
    <div class="cards" id="cards"></div>
  </div>

  <div class="side">
    <section class="panel">
      <h2 id="formTitle">スケジュールを追加</h2>
      <div class="body">
        <input type="hidden" id="ruleId">
        <label for="label">名前</label>
        <input id="label" maxlength="40" placeholder="例：朝稽古">
        <label for="passcode">パスコード（6〜12桁）</label>
        <input id="passcode" class="mono" inputmode="numeric" maxlength="12" placeholder="123456">
        <label for="repeat">繰り返し</label>
        <select id="repeat">
          <option value="daily">毎日</option>
          <option value="weekly">毎週（曜日を指定）</option>
          <option value="date">日付を指定（1回だけ）</option>
        </select>
        <div id="weekdayWrap" hidden>
          <label>曜日</label>
          <div class="checks" id="weekdays"></div>
        </div>
        <div id="dateWrap" hidden>
          <label for="onDate">日付</label>
          <input type="date" id="onDate">
        </div>
        <div class="row">
          <div><label for="start">開始</label><input type="time" id="start" value="09:00"></div>
          <div><label for="end">終了</label><input type="time" id="end" value="21:00"></div>
        </div>
        <p class="hint">終了が開始より早い場合は翌日まで有効になります（例 22:00→06:00）。</p>
        <label for="keyType">パスコードの種類</label>
        <select id="keyType">
          <option value="timeLimit">期限付き（推奨・端末側でも自動失効）</option>
          <option value="permanent">常時有効（終了時刻にこのアプリが削除）</option>
        </select>
        <label for="lead">何分前に登録するか</label>
        <input type="number" id="lead" min="0" max="1440" value="10">
        <p class="hint">SwitchBot の登録は反映に1分ほどかかります。10分前が安全です。</p>
        <label for="note">メモ</label>
        <input id="note" maxlength="200" placeholder="任意">
        <div class="inline">
          <input type="checkbox" id="enabled" checked>
          <label for="enabled">このスケジュールを動かす</label>
        </div>
        <div class="inline">
          <input type="checkbox" id="panel">
          <label for="panel">この番号を操作パネルで扱う（1件だけ）</label>
        </div>
        <div id="panelWrap" hidden>
          <label for="panelMinutes">パネルで有効化したときの有効時間（分）</label>
          <input type="number" id="panelMinutes" min="1" max="43200" value="120">
        </div>
        <div class="actions">
          <button class="primary" id="saveBtn">追加する</button>
          <button id="resetBtn" hidden>編集をやめる</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>今すぐ発行</h2>
      <div class="body">
        <label for="adhocCode">パスコード</label>
        <input id="adhocCode" class="mono" inputmode="numeric" maxlength="12" placeholder="654321">
        <label for="adhocMinutes">有効時間（分）</label>
        <input type="number" id="adhocMinutes" min="1" max="43200" value="60">
        <div class="actions"><button class="go" id="adhocBtn">発行する</button></div>
      </div>
    </section>

    <section class="panel">
      <h2>認証パッドに入っている番号</h2>
      <div class="body">
        <div class="actions" style="margin:0 0 10px">
          <button id="refreshBtn">今すぐ同期</button>
          <span class="hint" id="syncedAt"></span>
        </div>
        <div id="keys"></div>
      </div>
    </section>

    <section class="panel">
      <h2>動作ログ</h2>
      <div class="body"><div class="logs" id="logs"></div></div>
    </section>
  </div>
</main>

<script>
const WD = ["月","火","水","木","金","土","日"];
const $ = (id) => document.getElementById(id);
let state = null, editingId = null, serverSkew = 0;

// ---------------------------------------------------------------- 時計
function tickClock(){
  const t = new Date(Date.now() + serverSkew);
  const p = (n) => String(n).padStart(2,"0");
  $("clock").firstChild.nodeValue = `${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())}`;
  $("today").textContent = `${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())} ${WD[(t.getDay()+6)%7]}`;
}
setInterval(tickClock, 1000);

// ---------------------------------------------------------------- 通信
async function api(path, options){
  const res = await fetch(path, Object.assign({headers:{"Content-Type":"application/json"}}, options));
  if(res.status === 401){ location.href = "/login?next=" + encodeURIComponent(location.pathname); return; }
  const data = await res.json().catch(() => ({ok:false, error:"応答を解釈できませんでした"}));
  if(!data.ok) throw new Error(data.error || `エラー (${res.status})`);
  return data;
}
function notify(message, ok){
  $("banner").innerHTML = `<div class="banner ${ok ? "ok" : ""}">${escapeHtml(message)}</div>`;
  if(ok) setTimeout(() => { $("banner").innerHTML = ""; }, 6000);
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function load(refresh){
  const data = await api("/api/state" + (refresh ? "?refresh=1" : ""));
  if(!data) return;
  state = data;
  serverSkew = new Date(data.now).getTime() - Date.now();
  tickClock();
  renderCards();
  renderKeys();
  renderLogs();
  if(data.last_error) notify("SwitchBot と通信できていません: " + data.last_error, false);
}

// ---------------------------------------------------------------- ルール描画
function minutesOf(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  return h*60 + m;
}
function dayBar(rule){
  const s = minutesOf(rule.start_time), e = minutesOf(rule.end_time);
  const segs = e > s ? [[s,e]] : [[s,1440],[0,e]];
  const now = new Date(Date.now() + serverSkew);
  const nowPct = ((now.getHours()*60 + now.getMinutes()) / 1440 * 100).toFixed(2);
  const fills = segs.map(([a,b]) =>
    `<i style="left:${(a/1440*100).toFixed(2)}%;width:${((b-a)/1440*100).toFixed(2)}%"></i>`).join("");
  return `<div class="bar">${fills}<b style="left:${nowPct}%"></b></div>
    <div class="ticks"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>`;
}
function statusOf(rule){
  if(!rule.enabled) return ["stop","停止中"];
  const phase = rule.next_run && rule.next_run.phase;
  if(phase === "有効期間中") return ["live","有効期間中"];
  return ["pending","発行待ち"];
}
function fmt(iso){
  if(!iso) return "-";
  const d = new Date(iso), p = (n) => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
/* 端末にいま載っている発行を探す。パネルや手動で同じ番号が出ている場合も拾う */
function liveIssuance(rule){
  const live = (state.issuances || []).filter(
    (i) => ["creating","active","deleting"].includes(i.state));
  return live.find((i) => i.rule_id === rule.id)
      || live.find((i) => i.passcode === rule.passcode)
      || null;
}
function issuanceBadge(rule){
  const iss = liveIssuance(rule);
  if(!iss) return "";
  const label = iss.state === "creating" ? "登録中"
              : iss.state === "deleting" ? "解除中" : "端末に登録済";
  const cls = iss.state === "active" ? "live" : "pending";
  const src = iss.rule_id === rule.id ? "" : "（パネル/手動）";
  return `<span class="pill ${cls}">${label}${src}</span>`;
}

function renderCards(){
  const box = $("cards");
  if(!state.rules.length){
    box.innerHTML = `<div class="card"><div class="empty">
      スケジュールがまだありません。右のフォームで、番号と時間帯を登録してください。</div></div>`;
    return;
  }
  box.innerHTML = state.rules.map((r) => {
    const [cls,text] = statusOf(r);
    const repeat = r.repeat_type === "daily" ? "毎日"
      : r.repeat_type === "weekly" ? "毎週 " + r.weekdays_label : r.on_date;
    const days = r.repeat_type === "weekly"
      ? `<div class="days">${WD.map((d,i) =>
          `<span class="${r.weekdays.split(",").includes(String(i)) ? "on" : ""}">${d}</span>`).join("")}</div>`
      : "";
    const overnight = minutesOf(r.end_time) <= minutesOf(r.start_time) ? " <span>翌日</span>" : "";
    const next = r.next_run
      ? (r.next_run.phase === "有効期間中"
          ? `削除予定 ${fmt(r.next_run.at)}`
          : `次の登録 ${fmt(r.next_run.at)}（有効 ${fmt(r.next_run.start)} 〜 ${fmt(r.next_run.end)}）`)
      : "予定なし";
    const live = issuanceBadge(r);
    const panelBadge = r.panel ? `<span class="pill pending">操作パネル ${r.panel_minutes}分</span>` : "";
    return `<article class="card ${r.enabled ? "" : "off"}">
      <div class="top">
        <div>
          <div class="name">${escapeHtml(r.label)}</div>
          <div class="note">${escapeHtml(repeat)}${r.note ? " ／ " + escapeHtml(r.note) : ""}</div>
        </div>
        <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${panelBadge}${live}<span class="pill ${cls}">${text}</span></div>
      </div>
      <div class="code">${escapeHtml(r.passcode)}</div>
      <div class="range">${r.start_time} → ${r.end_time}${overnight}
        ／ ${r.key_type === "timeLimit" ? "期限付き" : "常時有効"}</div>
      ${days}
      ${dayBar(r)}
      <div class="next">${escapeHtml(next)}</div>
      <div class="actions">
        <button data-act="edit" data-id="${r.id}">編集</button>
        <button class="go" data-act="issue" data-id="${r.id}">今すぐ発行</button>
        <button class="danger" data-act="revoke" data-id="${r.id}">今すぐ無効</button>
        <button data-act="toggle" data-id="${r.id}">${r.enabled ? "停止" : "再開"}</button>
        <button class="danger" data-act="delete" data-id="${r.id}">削除</button>
      </div>
    </article>`;
  }).join("");
}

function renderKeys(){
  const keys = state.keys || [];
  $("syncedAt").textContent = state.keys_synced_at
    ? "最終同期 " + fmt(new Date(state.keys_synced_at*1000).toISOString()) : "未同期";
  if(!keys.length){
    $("keys").innerHTML = `<div class="empty">登録されている番号はありません。</div>`;
    return;
  }
  $("keys").innerHTML = `<table><thead><tr>
      <th>名前</th><th>番号</th><th>状態</th><th></th></tr></thead><tbody>
    ${keys.map((k) => `<tr>
      <td>${escapeHtml(k.name)}<br><span class="hint">${escapeHtml(k.type || "")} / id ${k.id}</span></td>
      <td class="num">${escapeHtml(k.plain || "＊＊＊＊")}</td>
      <td>${k.status === "normal" ? "有効" : "失効"}</td>
      <td><button class="danger" data-act="delkey" data-id="${k.id}">削除</button></td>
    </tr>`).join("")}</tbody></table>`;
}

function renderLogs(){
  $("logs").innerHTML = (state.logs || []).map((l) => {
    const t = new Date(l.ts*1000), p = (n) => String(n).padStart(2,"0");
    return `<div class="${l.level}">${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())} ${escapeHtml(l.message)}</div>`;
  }).join("") || `<div class="empty">まだ動きはありません。</div>`;
}

// ---------------------------------------------------------------- フォーム
$("weekdays").innerHTML = WD.map((d,i) =>
  `<label data-wd="${i}"><input type="checkbox" value="${i}">${d}</label>`).join("");
$("weekdays").addEventListener("change", (ev) => {
  ev.target.closest("label").classList.toggle("on", ev.target.checked);
});
$("repeat").addEventListener("change", syncFormMode);
$("panel").addEventListener("change", () => { $("panelWrap").hidden = !$("panel").checked; });
function syncFormMode(){
  const v = $("repeat").value;
  $("weekdayWrap").hidden = v !== "weekly";
  $("dateWrap").hidden = v !== "date";
}
function readForm(){
  return {
    label: $("label").value,
    passcode: $("passcode").value.trim(),
    key_type: $("keyType").value,
    repeat_type: $("repeat").value,
    weekdays: [...$("weekdays").querySelectorAll("input:checked")].map((c) => c.value),
    on_date: $("onDate").value,
    start_time: $("start").value,
    end_time: $("end").value,
    lead_minutes: Number($("lead").value),
    note: $("note").value,
    enabled: $("enabled").checked,
    panel: $("panel").checked,
    panel_minutes: Number($("panelMinutes").value),
  };
}
function fillForm(r){
  editingId = r ? r.id : null;
  $("formTitle").textContent = r ? `「${r.label}」を編集` : "スケジュールを追加";
  $("saveBtn").textContent = r ? "更新する" : "追加する";
  $("resetBtn").hidden = !r;
  $("label").value = r ? r.label : "";
  $("passcode").value = r ? r.passcode : "";
  $("keyType").value = r ? r.key_type : "timeLimit";
  $("repeat").value = r ? r.repeat_type : "daily";
  $("onDate").value = r ? r.on_date : "";
  $("start").value = r ? r.start_time : "09:00";
  $("end").value = r ? r.end_time : "21:00";
  $("lead").value = r ? r.lead_minutes : 10;
  $("note").value = r ? r.note : "";
  $("enabled").checked = r ? !!r.enabled : true;
  $("panel").checked = r ? !!r.panel : false;
  $("panelMinutes").value = r ? r.panel_minutes : 120;
  $("panelWrap").hidden = !$("panel").checked;
  const on = r ? String(r.weekdays).split(",") : [];
  $("weekdays").querySelectorAll("label").forEach((lb) => {
    const checked = on.includes(lb.dataset.wd);
    lb.querySelector("input").checked = checked;
    lb.classList.toggle("on", checked);
  });
  syncFormMode();
  window.scrollTo({top:0, behavior:"smooth"});
}

$("saveBtn").addEventListener("click", async () => {
  try{
    const body = JSON.stringify(readForm());
    if(editingId){
      await api(`/api/rules/${editingId}`, {method:"PUT", body});
      notify("スケジュールを更新しました。", true);
    }else{
      await api("/api/rules", {method:"POST", body});
      notify("スケジュールを追加しました。", true);
    }
    fillForm(null);
    await load();
  }catch(e){ notify(e.message, false); }
});
$("resetBtn").addEventListener("click", () => fillForm(null));

$("adhocBtn").addEventListener("click", async () => {
  try{
    const res = await api("/api/issue-adhoc", {method:"POST", body: JSON.stringify({
      label:"manual", passcode: $("adhocCode").value.trim(), minutes: Number($("adhocMinutes").value)})});
    notify("発行を依頼しました。認証パッドに反映されるまで1分ほどかかります。"
      + (res.clamped_by ? `（スケジュール「${res.clamped_by}」にあわせて ${res.aligned_until} まで）` : ""), true);
    $("adhocCode").value = "";
    await load(true);
  }catch(e){ notify(e.message, false); }
});
$("refreshBtn").addEventListener("click", async () => {
  try{ await load(true); notify("同期しました。", true); }
  catch(e){ notify(e.message, false); }
});

// ---------------------------------------------------------------- クリック処理
document.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-act]");
  if(!btn) return;
  const id = Number(btn.dataset.id);
  const rule = (state.rules || []).find((r) => r.id === id);
  btn.disabled = true;
  try{
    switch(btn.dataset.act){
      case "edit":
        fillForm(rule); break;
      case "issue": {
        const res = await api(`/api/rules/${id}/issue-now`, {method:"POST", body:"{}"});
        notify("発行を依頼しました。反映まで1分ほどかかります。"
          + (res.clamped_by ? `（スケジュール「${res.clamped_by}」にあわせて ${res.aligned_until} まで）` : ""), true);
        break;
      }
      case "revoke": {
        const res = await api(`/api/rules/${id}/revoke-now`, {method:"POST", body:"{}"});
        notify(res.revoked ? `${res.revoked} 件の削除を依頼しました。` : "有効なパスコードはありませんでした。", true);
        break;
      }
      case "toggle": {
        const body = Object.assign({}, rule, {enabled: !rule.enabled,
          weekdays: String(rule.weekdays).split(",").filter(Boolean)});
        await api(`/api/rules/${id}`, {method:"PUT", body: JSON.stringify(body)});
        break;
      }
      case "delete":
        if(!confirm(`「${rule.label}」を削除します。端末に登録済みの番号も消します。`)) break;
        await api(`/api/rules/${id}`, {method:"DELETE"});
        notify("削除しました。", true); break;
      case "delkey":
        if(!confirm(`id ${id} の番号を認証パッドから削除します。`)) break;
        await api(`/api/keys/${id}/delete`, {method:"POST", body:"{}"});
        notify("削除を依頼しました。", true); break;
    }
    await load(btn.dataset.act === "edit" ? false : true);
  }catch(e){ notify(e.message, false); }
  finally{ btn.disabled = false; }
});

// ---------------------------------------------------------------- 起動
syncFormMode();
load().catch((e) => notify(e.message, false));
setInterval(() => load().catch(() => {}), 20000);
</script>
