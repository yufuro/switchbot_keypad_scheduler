<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1F24">
<title>パスコード操作</title>
<style>
:root{
  --bg:#1B1F24; --fg:#F4F6F8; --dim:#98A2AD;
  --on:#0F7A55; --on-soft:#146B4E; --off:#8C2F27; --wait:#8A6A1F;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  display:flex;flex-direction:column;overflow:hidden;
  transition:background-color .35s ease;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body.state-on{background:#0C3A2B}
body.state-off{background:#1B1F24}
body.state-wait{background:#3A2F14}
body.state-error{background:#3A1A16}

/* ------------------------------------------------- 状態表示 */
.status{flex:0 0 auto;padding:22px 24px 14px;text-align:center}
.lamp{display:inline-flex;align-items:center;gap:12px;padding:10px 26px;border-radius:99px;
  border:2px solid rgba(255,255,255,.22);background:rgba(0,0,0,.22)}
.lamp .dot{width:16px;height:16px;border-radius:50%;background:var(--dim)}
body.state-on  .lamp .dot{background:#3DD9A0;box-shadow:0 0 18px #3DD9A0}
body.state-wait .lamp .dot{background:#E8C15A;box-shadow:0 0 18px #E8C15A}
body.state-error .lamp .dot{background:#F08A80;box-shadow:0 0 18px #F08A80}
.lamp .word{font-size:clamp(26px,7vw,46px);font-weight:700;letter-spacing:.12em}
.sub{margin-top:12px;color:var(--dim);font-size:clamp(13px,3.4vw,16px);min-height:1.6em}
.code{font-family:var(--mono);font-size:clamp(38px,13vw,86px);letter-spacing:.18em;
  margin:10px 0 0;line-height:1.1}
.code.hidden-code{color:rgba(255,255,255,.28)}
.remain{font-family:var(--mono);font-size:clamp(15px,4.2vw,20px);color:var(--dim);letter-spacing:.08em}

/* ------------------------------------------------- ボタン */
.buttons{flex:1 1 auto;display:grid;grid-template-rows:1fr 1fr;gap:14px;padding:8px 16px 16px}
@media(min-width:820px) and (orientation:landscape){
  .buttons{grid-template-rows:1fr;grid-template-columns:1fr 1fr}
}
button.big{width:100%;height:100%;border:none;border-radius:20px;cursor:pointer;
  font-family:inherit;font-size:clamp(30px,8vw,58px);font-weight:700;letter-spacing:.1em;
  color:#fff;position:relative;overflow:hidden;
  box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .08s ease,filter .15s ease}
button.big:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
button.big:focus-visible{outline:4px solid #fff;outline-offset:-8px}
button.big[disabled]{filter:grayscale(.5) brightness(.65);cursor:progress}
#btnOn{background:linear-gradient(180deg,#149063,var(--on-soft))}
#btnOff{background:linear-gradient(180deg,#A93A31,#7C2620)}
button.big small{display:block;font-size:clamp(12px,3vw,16px);font-weight:500;
  letter-spacing:.06em;opacity:.85;margin-top:8px}
button.big.pressed::after{content:"";position:absolute;inset:0;background:#fff;opacity:.55;
  animation:flash .45s ease-out forwards}
@keyframes flash{to{opacity:0}}

/* ------------------------------------------------- 足元 */
footer{flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:0 20px 14px;color:var(--dim);font-size:12px}
footer a{color:var(--dim)}
footer .spacer{margin-left:auto}
footer button{background:none;border:1px solid rgba(255,255,255,.25);color:var(--dim);
  border-radius:8px;padding:5px 12px;font-family:inherit;font-size:12px;cursor:pointer}
@media(prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body class="state-off">

<div class="status">
  <div class="lamp"><span class="dot"></span><span class="word" id="word">確認中</span></div>
  <div class="code hidden-code" id="code">------</div>
  <div class="remain" id="remain"></div>
  <div class="sub" id="sub" role="status" aria-live="polite">状態を読み込んでいます…</div>
</div>

<div class="buttons">
  <button class="big" id="btnOn">パスコード有効<small id="onHint"></small></button>
  <button class="big" id="btnOff">パスコード無効<small>いま使える番号をすべて消します</small></button>
</div>

<footer>
  <span id="label"></span>
  <span class="spacer"></span>
  <button id="mute">音 オン</button>
  <button id="reveal">番号を隠す</button>
  <a href="/">管理画面</a>
</footer>

<script>
const $ = (id) => document.getElementById(id);
let status = null, soundOn = true, showCode = true, busy = false, pollTimer = null, lastWord = "", note = "";

/* ------------------------------------------------------------------ 音 */
let ac = null;
function audio(){
  if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if(ac.state === "suspended") ac.resume();
  return ac;
}
function beep(freq, start, dur, type, gain){
  const ctx = audio();
  const osc = ctx.createOscillator(), amp = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  amp.gain.setValueAtTime(0.0001, ctx.currentTime + start);
  amp.gain.exponentialRampToValueAtTime(gain || 0.3, ctx.currentTime + start + 0.02);
  amp.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
  osc.connect(amp).connect(ctx.destination);
  osc.start(ctx.currentTime + start);
  osc.stop(ctx.currentTime + start + dur + 0.02);
}
function play(kind){
  if(!soundOn) return;
  try{
    if(kind === "on"){ [660,880,1175].forEach((f,i) => beep(f, i*0.11, 0.14, "sine", 0.26)); }
    else if(kind === "off"){ beep(620, 0, 0.14, "triangle", 0.24); beep(330, 0.12, 0.24, "triangle", 0.24); }
    else if(kind === "tap"){ beep(1000, 0, 0.05, "sine", 0.14); }
    else if(kind === "wait"){ beep(760, 0, 0.09, "sine", 0.14); }
    else if(kind === "error"){ [0,0.17,0.34].forEach((t) => beep(200, t, 0.13, "square", 0.28)); }
  }catch(e){ /* 音が出せない環境でも操作は続ける */ }
}

/* --------------------------------------------------------------- 合成音声 */
const canSpeak = "speechSynthesis" in window;
let jaVoice = null;
function pickVoice(){
  if(!canSpeak) return;
  const voices = speechSynthesis.getVoices();
  jaVoice = voices.find((v) => /^ja/i.test(v.lang) && /Kyoko|Otoya|O-?ren|Hattori/i.test(v.name))
         || voices.find((v) => /^ja/i.test(v.lang))
         || null;
}
if(canSpeak){
  pickVoice();
  speechSynthesis.addEventListener("voiceschanged", pickVoice);
}
function say(text, interrupt){
  if(!soundOn || !canSpeak || !text) return;
  try{
    if(interrupt) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    if(jaVoice) u.voice = jaVoice;
    u.rate = 1.05; u.pitch = 1.0; u.volume = 1.0;
    speechSynthesis.speak(u);
  }catch(e){ /* 読み上げできない環境では表示だけで伝える */ }
}
/* 押した直後の発声と、確定したときの発声が重ならないようにする */
let spokeAt = 0, spokeDir = "";
function speakPress(dir){
  spokeAt = Date.now(); spokeDir = dir;
  say(dir === "on" ? "パスコード有効" : "パスコード無効", true);
}
function speakSettled(dir){
  if(spokeDir === dir && Date.now() - spokeAt < 5000) return;   // 直前に言ったので省く
  say(dir === "on" ? "パスコードが有効になりました" : "パスコードを無効にしました", false);
}

/* ------------------------------------------------------------------ 表示 */
function setBody(cls){ document.body.className = "state-" + cls; }
function fmtRemain(sec){
  if(sec <= 0) return "";
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  const p = (n) => String(n).padStart(2,"0");
  return (h ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`) + " で自動的に無効";
}
function render(){
  if(!status) return;
  if(!status.configured){
    setBody("error"); $("word").textContent = "未設定";
    $("code").textContent = "------"; $("sub").textContent =
      "管理画面のスケジュールで「このパスコードをパネルで操作する」を1件選んでください。";
    $("btnOn").disabled = $("btnOff").disabled = true;
    return;
  }
  $("btnOn").disabled = $("btnOff").disabled = busy;
  $("label").textContent = status.label + (status.count > 1 ? `（${status.count}件）` : "");
  $("onHint").textContent = `押すと ${status.panel_minutes} 分間つかえます`;

  const creating = status.state === "creating";
  const deleting = status.state === "deleting";
  const word = deleting ? "解除中" : !status.on ? "無効" : creating ? "登録中" : "有効";
  setBody(creating || deleting ? "wait" : status.on ? "on" : "off");
  $("word").textContent = word;

  const visible = status.on && showCode && !creating;
  $("code").textContent = visible ? status.passcode : (status.on ? "＊＊＊＊＊＊" : "------");
  $("code").classList.toggle("hidden-code", !status.on);

  if(deleting){
    $("sub").textContent = "認証パッドから消しています。反映まで1分ほどかかります。";
    $("remain").textContent = "";
  }else if(!status.on){
    note = "";
    $("sub").textContent = "いまこの番号では開きません。";
    $("remain").textContent = "";
  }else if(creating){
    $("sub").textContent = "認証パッドへ送信中です。反映まで1分ほどかかります。";
    $("remain").textContent = "";
  }else{
    $("sub").textContent = "この番号で開けられます。" + (note ? " " + note : "");
    const left = (status.valid_to || 0) - Math.floor(Date.now()/1000);
    $("remain").textContent = status.valid_to ? fmtRemain(left) : "時間の制限なし";
  }
  if(word !== lastWord && lastWord !== ""){
    if(word === "有効"){ play("on"); speakSettled("on"); }
    else if(word === "無効"){ play("off"); speakSettled("off"); }
    else{ play("wait"); }
  }
  lastWord = word;
}
setInterval(() => { if(status && status.on && status.valid_to) render(); }, 1000);

/* ------------------------------------------------------------------ 通信 */
async function poll(){
  try{
    const res = await fetch("/api/panel");
    if(res.status === 401){ location.href = "/login?next=/panel"; return; }
    const data = await res.json();
    if(data.ok){ status = data; render(); }
  }catch(e){ /* 次の周期で取り直す */ }
  clearTimeout(pollTimer);
  const wait = status && ["creating","deleting"].includes(status.state) ? 3000 : 6000;
  pollTimer = setTimeout(poll, wait);
}

async function send(path, kind, btn){
  if(busy) return;
  busy = true; btn.classList.add("pressed");
  play("tap"); speakPress(kind);
  $("btnOn").disabled = $("btnOff").disabled = true;
  $("sub").textContent = "送信しています…";
  try{
    const res = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
    if(res.status === 401){ location.href = "/login?next=/panel"; return; }
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "失敗しました");
    if(!data.busy) play(kind);
    status = Object.assign(status || {}, data);
    note = data.clamped_by
      ? `スケジュール「${data.clamped_by}」の終了時刻で切れます。`
      : (data.already ? "すでにスケジュールで有効になっています。" : "");
    if(data.busy){
      note = "";
      play("wait");
      $("sub").textContent = "前の操作の解除中です。1分ほど待ってからもう一度押してください。";
      say("解除中です。少しお待ちください", true);
    }
    lastWord = "";
  }catch(e){
    play("error"); say("エラーです", true); setBody("error");
    $("word").textContent = "エラー";
    $("sub").textContent = e.message;
    busy = false;
    setTimeout(() => { lastWord = ""; poll(); }, 2500);
    setTimeout(() => btn.classList.remove("pressed"), 500);
    return;
  }
  busy = false;
  setTimeout(() => btn.classList.remove("pressed"), 500);
  render(); poll();
}

$("btnOn").addEventListener("click", (e) => send("/api/panel/on", "on", e.currentTarget));
$("btnOff").addEventListener("click", (e) => send("/api/panel/off", "off", e.currentTarget));
$("mute").addEventListener("click", (e) => {
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? "音 オン" : "音 オフ";
  if(soundOn){ play("tap"); say("音声オン", true); }
  else if(canSpeak){ speechSynthesis.cancel(); }
});
$("reveal").addEventListener("click", (e) => {
  showCode = !showCode;
  e.currentTarget.textContent = showCode ? "番号を隠す" : "番号を表示";
  render();
});
document.addEventListener("keydown", (ev) => {
  if(ev.key === "Enter" || ev.key === " ") return;      // ボタンの既定動作にまかせる
});

poll();
</script>
</body>
</html>
